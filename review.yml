actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No documented public WebSocket API surface exists. Courier's public API is
    request/response REST (base https://api.courier.com), and its documented
    asynchronous event mechanism is outbound webhooks (signed HTTP POSTs), which
    are server-to-endpoint HTTP rather than WebSocket. The Courier Inbox uses a
    realtime WebSocket, but only as an internal transport managed by the client
    SDKs with no published endpoint, protocol, or schema - so there is nothing to
    model as a public AsyncAPI WebSocket document. No AsyncAPI file was created.
