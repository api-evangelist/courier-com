aid: courier-com
url: https://raw.githubusercontent.com/api-evangelist/courier-com/refs/heads/main/apis.yml
name: Courier
kind: company
description: Courier is notification infrastructure for product and engineering teams -
  a single API that orchestrates transactional and product messaging across email,
  SMS, push, chat (Slack, Teams), and an in-app inbox. One Send call routes a
  notification to the right channel(s) per recipient using templates designed in a
  visual studio, subscription topics, user preferences, brands, audiences, and
  automation workflows. The REST API (base https://api.courier.com) also manages
  users/profiles, lists, tenants for multi-tenant apps, translations, bulk sends,
  and audit events, and is wrapped by official server SDKs (Node, Python, Go, Ruby,
  PHP, Java) and a CLI.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Notifications
- Messaging
- Email
- SMS
- Push
- Multi-Channel
- Notification Infrastructure
- In-App Inbox
created: '2026-07-02'
modified: '2026-07-02'
