description: >-
  FinOps view of Courier spend. Courier is billed on a usage basis metered on
  notifications sent - one send counts once regardless of how many channels it
  fans out to (email, SMS, push, in-app inbox, chat). A free Developer allowance
  covers low volume; the Business tier is pay-as-you-go per notification with no
  cap; Enterprise is custom with volume discounts. The dominant cost driver is
  notification volume, so cost control centers on suppressing unnecessary sends,
  honoring user preferences and subscription topics, batching via automations, and
  using idempotency to avoid duplicate charges. Note that downstream channel
  providers (your own SMS/email/push vendors) may carry their own separate costs.
notes: >-
  Per-notification rates and the free allowance should be reconciled against the
  Courier pricing page. Courier's charge is per notification sent to Courier;
  underlying carrier/provider fees for the actual email/SMS delivery may be billed
  separately depending on your integration.
