meters:
- name: notifications_sent
  description: Notifications sent to Courier, billed per send regardless of channel count. The primary cost driver.
  unit: notifications
  aggregation: sum
  dimensions:
  - account
  - environment
  - template
  - channel
- name: bulk_notifications
  description: Notifications dispatched through bulk jobs; count as sends.
  unit: notifications
  aggregation: sum
  dimensions:
  - account
  - job
- name: automation_notifications
  description: Notifications produced by automation/journey runs; count as sends.
  unit: notifications
  aggregation: sum
  dimensions:
  - account
  - automation
principles:
- name: Visibility
  description: Track notifications sent per template, channel, tenant, and environment; separate test from production so evaluation traffic is not mistaken for billable volume.
- name: Allocation
  description: Tag sends by tenant and template so notification cost maps to products, teams, and customers in multi-tenant apps.
- name: Optimization
  description: Honor user preferences and subscription topics to suppress unwanted sends, batch and throttle via automations, dedupe with idempotency keys, and consolidate multi-channel routing into a single send rather than repeated sends.
- name: Accountability
  description: Assign owners per template/tenant and review monthly notification volume against the free allowance or the per-send Business rate, plus any separate downstream carrier fees.
